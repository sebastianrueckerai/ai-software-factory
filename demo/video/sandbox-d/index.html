<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600, height=900">
<title>The sandbox, in sequence</title>
<link rel="stylesheet" href="diagram.css">
<script src="gsap.min.js"></script>
<style>
  #root { position: relative; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); }

  /* a unit is lit by --hi: 1 is the one element the caption talks about, 0 is the settled, muted state */
  .u { --hi: 0; --lc: var(--accent); --c: color-mix(in srgb, var(--lc) calc(var(--hi) * 100%), #93a1b5); --b: color-mix(in srgb, var(--lc) calc(var(--hi) * 100%), #263649); --k: color-mix(in srgb, var(--lc) calc(var(--hi) * 100%), #2c4056); color: var(--c); }
  .u.amb { --lc: var(--need); }

  .heads { position: absolute; left: 0; top: 0; width: 1600px; height: 164px; background: var(--bg); z-index: 2; }
  .head { position: absolute; top: 78px; width: 236px; height: 80px; padding: 6px 6px; text-align: center; border-color: #263649; background: var(--bg-panel); opacity: 0; }
  .head::after { border-color: #2c4056; }
  .head h2 { font-size: 28px; line-height: 36px; margin: 0; white-space: nowrap; color: #93a1b5; }
  .head p { font-size: 25px; line-height: 30px; color: #93a1b5; white-space: nowrap; }
  #view { position: absolute; left: 0; top: 0; width: 1600px; height: 744px; overflow: hidden; z-index: 1; }
  #flow { position: absolute; left: 0; top: 0; width: 1600px; height: 2000px; }
  #flow svg { position: absolute; left: 0; top: 0; width: 1600px; height: 2000px; overflow: visible; }
  .life { stroke: #263649; stroke-width: 2; stroke-dasharray: 8 7; opacity: 0; }
  .act { fill: color-mix(in srgb, var(--accent) 12%, var(--bg)); stroke: #2c4056; stroke-width: 1.5; }
  .arr { fill: none; stroke: var(--k); stroke-width: 2.5; }
  .arr.ret { stroke-dasharray: 8 6; }
  .arr.lost { stroke-dasharray: 6 6; }
  .tip { fill: var(--k); opacity: 0; }
  .xm { stroke: var(--k); stroke-width: 4; fill: none; opacity: 0; }
  .xm.big { stroke-width: 5; }
  .ck { stroke: var(--k); stroke-width: 4; fill: none; opacity: 0; }
  .lbl { position: absolute; padding: 0 8px; background: var(--bg); font-size: 30px; line-height: 36px; white-space: nowrap; transform: translateX(-50%); opacity: 0; }
  .note { position: absolute; padding: 4px 14px; background: var(--bg-panel); border: 1px solid var(--b); font-size: 28px; line-height: 36px; white-space: nowrap; transform: translateX(-50%); text-align: center; opacity: 0; }
  .note.amb { background: var(--need-tint); }

  .caption { position: absolute; left: 40px; top: 774px; width: 1100px; height: 120px; }
  .caption span { position: absolute; left: 0; top: 0; width: max-content; max-width: 1100px; padding: 12px 22px; font: 500 44px/1.2 var(--font-ui); color: #c3cfdf; text-align: left; background: color-mix(in srgb, var(--bg) 90%, transparent); border-left: 6px solid var(--accent); box-shadow: 0 6px 24px rgba(0,0,0,.5); opacity: 0; }
  .caption span.m { border-left-color: var(--need); }
  .caption span.two { font-size: 40px; }
  .caption b { font-weight: 700; color: var(--accent); }
  .caption b.m { color: var(--need-text); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="65.8" data-width="1600" data-height="900">
<div id="scene" class="clip" data-start="0" data-duration="65.8" style="position:absolute;inset:0">

<div id="view"><div id="flow"><svg id="fsvg" viewBox="0 0 1600 2000" aria-hidden="true"></svg></div></div>

<div class="heads">
  <section class="panel head" id="h-person" style="left:12px"><h2>A person</h2><p>decides at the cap</p></section>
  <section class="panel head" id="h-factory" style="left:252px"><h2>The factory</h2><p>runs the card</p></section>
  <section class="panel head" id="h-pod" style="left:522px"><h2>The pod</h2><p>the agent inside</p></section>
  <section class="panel head" id="h-gw" style="left:802px"><h2>Model gateway</h2><p>holds the keys</p></section>
  <section class="panel head" id="h-api" style="left:1062px"><h2>Model API</h2><p>hosted or yours</p></section>
  <section class="panel head" id="h-repo" style="left:1322px"><h2>Repository</h2><p>the card's code</p></section>
</div>

<div class="caption"></div>

</div>
</div>

<script>
// One paused timeline drives the clip: the renderer seeks it frame by frame, so nothing here reads the clock.
gsap.config({ force3D: false });
const tl = gsap.timeline({ paused: true });
const NS = "http://www.w3.org/2000/svg";
const flow = document.getElementById("flow"), svg = document.getElementById("fsvg"), capBox = document.querySelector(".caption");
const X = { person: 130, factory: 370, pod: 640, gw: 920, api: 1180, repo: 1440 };
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const div = (cls, html, x, y) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; d.style.left = x + "px"; d.style.top = y + "px"; d.setAttribute("data-ov", ""); flow.appendChild(d); return d; };

// each beat: a caption and the rows it draws; a row is a message (msg), a return (ret), a probe that stops (lost), one that passes (open) or a note on a lane
const BEATS = [
  { dur: 3.0, cap: 'The factory starts <b>one throwaway pod</b> for each card.', rows: [{ k: "msg", a: "factory", b: "pod", t: "start one throwaway pod" }] },
  { dur: 4.0, cap: 'The pod runs in <b>gVisor</b>, non-root, read-only root, with <b>no service account token</b>.', rows: [{ k: "note", a: "pod", t: "gVisor · non-root · read-only root<br>no service account token" }] },
  { dur: 3.4, cap: 'Before the agent starts, the probe tries <b>the internet</b>: blocked.', rows: [{ k: "lost", a: "pod", t: "the internet" }] },
  { dur: 2.7, cap: 'It tries <b>the host machine</b>: blocked.', rows: [{ k: "lost", a: "pod", t: "the host machine" }] },
  { dur: 2.7, cap: 'It tries <b>the cloud metadata</b> address: blocked.', rows: [{ k: "lost", a: "pod", t: "cloud metadata 169.254.169.254" }] },
  { dur: 2.9, cap: 'Only <b>named hosts</b> are open.', rows: [{ k: "open", a: "pod", t: "a named host: open", start: true }] },
  { dur: 3.6, cap: 'Every model call goes through <b>the gateway</b>, with a one-hour identity.', rows: [{ k: "msg", a: "pod", b: "gw", t: "model call + 1-hour identity" }] },
  { dur: 3.0, cap: 'It <b class="m">reserves the worst case</b> first: €0.30.', rows: [{ k: "note", a: "gw", c: "amb", t: "hold €0.30, the worst case" }] },
  { dur: 3.6, cap: 'It sends the call to <b>the model API</b> with the model key.', rows: [{ k: "msg", a: "gw", b: "api", t: "call, with the model key" }] },
  { dur: 2.8, cap: 'The model API answers; the cost is <b class="m">€0.04</b>.', rows: [{ k: "ret", a: "api", b: "gw", t: "answer · cost €0.04" }] },
  { dur: 3.4, cap: 'The gateway books <b class="m">the real cost</b> and frees the rest.', rows: [{ k: "note", a: "gw", c: "amb", t: "book €0.04, free the rest" }] },
  { dur: 4.6, cap: 'The pod holds <b>a one-hour gateway identity</b>, never a push token or a model key.', rows: [{ k: "note", a: "pod", t: "holds a 1-hour identity for the gateway<br>never a push token, never a model key" }] },
  { dur: 3.8, cap: 'More calls fill <b class="m">the budget</b> to its cap: the gateway refuses the call.', rows: [{ k: "msg", a: "gw", b: "factory", c: "amb", t: "€2.00 of €2.00: cap reached, call refused" }] },
  { dur: 3.4, cap: 'The factory asks <b class="m">a person</b>: fund it or end it.', rows: [{ k: "msg", a: "factory", b: "person", c: "amb", t: "fund it or end it?" }] },
  { dur: 2.6, cap: 'The person <b class="m">funds it</b>.', rows: [{ k: "ret", a: "person", b: "factory", c: "amb", t: "fund it" }] },
  { dur: 2.8, cap: 'When the agent is done, the factory <b>kills it</b>.', rows: [{ k: "msg", a: "factory", b: "pod", t: "kill the agent's processes", end: true }] },
  { dur: 4.0, cap: 'It <b>mints a fresh write token</b> and <b>pushes once</b>.', rows: [{ k: "note", a: "factory", t: "mint a fresh write token" }, { k: "msg", a: "factory", b: "repo", t: "push once", off: 1.8 }] },
  { dur: 2.6, cap: 'It <b>revokes</b> the token.', rows: [{ k: "msg", a: "factory", b: "repo", t: "revoke the token" }] },
  { dur: 4.2, cap: 'It <b>deletes the pod</b>.', rows: [{ k: "msg", a: "factory", b: "pod", t: "delete the pod", kill: true }] },
];

const TOP = 164, BOTTOM = 730;
const lives = {};
for (const [k, x] of Object.entries(X)) lives[k] = el("line", { class: "life", x1: x, x2: x, y1: TOP, y2: 2000 });
const bar = el("rect", { class: "act", x: X.pod - 7, y: 0, width: 14, height: 0, opacity: 0 });
const heads = { person: "#h-person", factory: "#h-factory", pod: "#h-pod", gw: "#h-gw", api: "#h-api", repo: "#h-repo" };
const laneShown = { factory: true };
gsap.set(heads.factory, { opacity: 1 });
gsap.set(lives.factory, { opacity: 1 });
gsap.set(".u", { "--hi": 0 });

let y = 196, scroll = 0, actFrom = 0, T = 0, cur = [];
const lit = (units, at) => {
  if (cur.length) tl.to(cur, { "--hi": 0, duration: 0.4 }, at);
  tl.to(units, { "--hi": 1, duration: 0.3 }, at);
  cur = units;
};
const shown = [];

BEATS.forEach((B, bi) => {
  const t0 = T;
  const items = B.rows.map((r) => {
    const lines = r.t.split("<br>").length;
    const h = r.k === "note" ? 18 + lines * 36 : 60;
    const top = y;
    y += h + 4;
    return { r, h, top };
  });
  const bottom = items[items.length - 1].top + items[items.length - 1].h;
  let shift = 0.15;
  if (bottom - scroll > BOTTOM - 12) {
    scroll = items[0].top - TOP - 210;
    shift = 0.85;
    tl.to(flow, { top: -scroll, duration: 0.5, ease: "power1.inOut", force3D: false }, t0 + 0.25);
    for (const s of shown) if (!s.gone && s.top - scroll < TOP + 8) { s.gone = true; tl.to(s.els, { opacity: 0, duration: 0.2 }, t0 + 0.02); }
  }
  const all = [];
  items.forEach(({ r, h, top }) => {
    const at = t0 + shift + (r.off || 0);
    const els = [];
    const ay = r.k === "note" ? top + h / 2 : top + 46;
    for (const ln of [r.a, r.b]) if (ln && !laneShown[ln]) {
      laneShown[ln] = true;
      tl.to([heads[ln], lives[ln]], { opacity: 1, duration: 0.4 }, at - (r.off ? 0 : 0.1));
    }
    const amb = r.c === "amb" ? " amb" : "";
    if (r.k === "note") {
      const n = div("note u" + amb, r.t, X[r.a], top + 4);
      els.push(n);
      tl.to(n, { opacity: 1, duration: 0.25 }, at);
    } else {
      const xa = X[r.a], dir = (r.k === "lost" || r.k === "open") ? 1 : Math.sign(X[r.b] - xa);
      const xb = (r.k === "lost" || r.k === "open") ? xa + 170 : X[r.b] - dir * 8;
      const cls = "arr u" + amb + (r.k === "ret" ? " ret" : "") + (r.k === "lost" ? " lost" : "");
      const line = el("path", { class: cls, d: `M${xa} ${ay} H${xb}` });
      const dur = Math.min(0.45, 0.15 + Math.abs(xb - xa) / 2200);
      gsap.set(line, { attr: { d: `M${xa} ${ay} H${xa}` } });
      tl.to(line, { attr: { d: `M${xa} ${ay} H${xb}` }, duration: dur, ease: "none" }, at);
      els.push(line);
      const lab = div("lbl u" + amb, r.t, (r.k === "lost" || r.k === "open") ? xa + 24 : (xa + xb) / 2, ay - 42);
      if (r.k === "lost" || r.k === "open") lab.style.transform = "none";
      els.push(lab);
      tl.to(lab, { opacity: 1, duration: 0.25 }, at + 0.05);
      if (r.k === "lost") {
        const xm = el("path", { class: "xm u", d: `M${xb - 12} ${ay - 12} l24 24 M${xb + 12} ${ay - 12} l-24 24` });
        els.push(xm);
        tl.to(xm, { opacity: 1, duration: 0.15 }, at + dur);
      } else {
        const tip = el("path", { class: "tip u" + amb, d: `M${xb} ${ay} l${-dir * 14} -7 v14 z` });
        els.push(tip);
        tl.to(tip, { opacity: 1, duration: 0.1 }, at + dur);
        if (r.k === "open") {
          const ck = el("path", { class: "ck u", d: `M${xb + 18} ${ay - 2} l8 10 l16 -20` });
          els.push(ck);
          tl.to(ck, { opacity: 1, duration: 0.15 }, at + dur);
        }
      }
    }
    if (r.start) { actFrom = ay + 4; gsap.set(bar, { attr: { y: actFrom } }); tl.to(bar, { opacity: 1, duration: 0.2 }, at + 0.3); }
    else if (actFrom && !r.kill) tl.to(bar, { attr: { height: Math.max(0, ay - actFrom) }, duration: 0.25 }, at);
    if (r.end) actFrom = 0;
    if (r.kill) {
      const xm = el("path", { class: "xm u big", d: `M${X.pod - 18} ${ay - 18} l36 36 M${X.pod + 18} ${ay - 18} l-36 36` });
      tl.to(xm, { opacity: 1, duration: 0.15 }, at + 0.35);
      tl.set(lives.pod, { attr: { y2: ay } }, at + 0.35);
      els.push(xm);
    }
    shown.push({ top, els });
    all.push(...els);
  });
  lit(all, t0 + shift);
  const cs = document.createElement("span");
  cs.innerHTML = B.cap;
  capBox.appendChild(cs);
  tl.to(cs, { opacity: 1, duration: 0.25 }, t0);
  tl.to(cs, { opacity: 0, duration: 0.15 }, t0 + B.dur + (shift > 0.5 ? 0.7 : 0) - 0.15);
  T += B.dur + (shift > 0.5 ? 0.7 : 0);
});

tl.to("#scene", { opacity: 0, duration: 0.6, ease: "none" }, T);
T += 0.6;
tl.set({}, {}, T);
if (Math.abs(T - 65.8) > 0.01) throw new Error("duration " + T);
document.querySelectorAll(".caption span").forEach((s) => { if (s.querySelector("b.m")) s.classList.add("m"); if (s.getBoundingClientRect().height > 90) s.classList.add("two"); });
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
