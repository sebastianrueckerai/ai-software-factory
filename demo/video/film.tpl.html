<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600, height=900">
<title>The film</title>
<link rel="stylesheet" href="diagram.css">
<script src="gsap.min.js"></script>
<script src="data.js"></script>
<script src="film-fx.js"></script>
<style>
  .live { animation: none; }
  #root { position: relative; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  .media { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
  #caps { position: absolute; left: 0; right: 0; top: 744px; height: 156px; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 90%, transparent) 24%); }
  .fx-cap { position: absolute; left: 80px; right: 80px; top: 26px; text-align: center; font-size: 48px; line-height: 1.25; color: var(--text); }
  .fx-cap b { color: var(--accent); font-weight: 600; }
  .fx-cap.amber b { color: var(--need-text); }
  .fx-cap.close { top: -330px; font-size: 64px; }
  .fx-cap.label { top: 22px; left: 40px; right: auto; max-width: 1100px; text-align: left; font-size: 46px; line-height: 1.2; padding: 18px 30px;
    background: rgba(2, 4, 8, .95); border-left: 8px solid var(--accent);
    box-shadow: 0 0 0 1px rgba(223, 231, 241, .12), 0 12px 40px 8px rgba(0, 0, 0, .85); }
  .fx-cap.label.amber { border-left-color: var(--need); }
  .fx-cap.close small { display: block; margin-top: 18px; font: 34px var(--font-mono); color: var(--text-muted); }
  .title { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; opacity: 0; }
  .title i { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); }
  .title span { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font: 600 88px var(--font-ui); color: var(--text); }
  .title b { position: absolute; left: 700px; top: 500px; width: 200px; height: 4px; background: var(--accent); }
  #shade { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); opacity: 0; }
  .title.moral i { background: color-mix(in srgb, var(--bg) 88%, transparent); }
  .title.moral span { left: 160px; right: 160px; top: 330px; font: 600 60px/1.3 var(--font-ui); }
  .title.moral b { top: 300px; }
  /* the matte: the picture sits inside bars, so the player's controls cover no caption (matte in film.json) */
  #frame { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; }
  #dip { position: absolute; inset: 0; background: #000; opacity: 0; }
  .title.slate i { display: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1600" data-height="900">
<div id="frame">
<div id="stage">
<!--MEDIA-->
</div>
<div id="shade"></div>
<div id="dip"></div>
<div id="caps"></div>
<div id="titles"></div>
</div>
</div>

<script>
// One paused timeline drives the cut: the renderer seeks it frame by frame, so nothing here reads the clock. Two
// tracks come from film.json through data.js: spots move the one highlight, caps carry the words. A spot may hop from
// element to element while one caption stays up, and there is never more than one highlight on screen.
const tl = gsap.timeline({ paused: true });
const F = window.FILM;
const stage = document.querySelector("#stage"), caps = document.querySelector("#caps"), titles = document.querySelector("#titles");
// a plain cut has labels, not captions: no band darkens its frame, and the labels sit over the console's top bar, clear
// of the chat's input at the bottom
if (F.plain) Object.assign(caps.style, { background: "none", top: "0px" });
if (F.matte) {
  const k = (900 - F.matte.top - F.matte.bottom) / 900;
  Object.assign(document.querySelector("#frame").style, { transform: `translate(${(1600 - 1600 * k) / 2}px, ${F.matte.top}px) scale(${k})` });
  document.querySelector("#root").style.background = "#000";
}
// time: a number, ["seg"] for a segment's start, ["seg", "end"], or ["seg", step, field, offset], where field is atMs,
// stillMs, or actN for the moment the step's Nth action ended
const time = (a) => {
  if (typeof a === "number") return a;
  const [id, step, field = "stillMs", off = 0] = a, s = F.seg[id];
  if (!s) throw new Error(`no segment ${id}`);
  if (step === undefined || step === null) return s.start + off;
  if (step === "end") return s.start + s.dur + off;
  const st = F.scenes[s.scene].steps[step - 1];
  const ms = field.startsWith("act") ? st.acts[Number(field.slice(3))] : st[field];
  if (ms === undefined) throw new Error(`${id} step ${step} has no ${field}`);
  return media(s, ms / 1000) + off;
};
// media maps a moment of a scene's video to the output clock through the segment's pieces, each with its own rate
function media(s, m) {
  const ps = s.pieces;
  if (!ps || !ps.length) return s.start + (m - s.mediaStart) / s.rate;
  const p = ps.find((q) => m >= q.m0 && m <= q.m1) || (m < ps[0].m0 ? ps[0] : ps[ps.length - 1]);
  return p.t0 + (Math.min(Math.max(m, p.m0), p.m1) - p.m0) / p.rate;
}
const clip = (b) => { const y = Math.max(0, b.y), h = Math.min(900, b.y + b.height) - y; return { x: b.x, y, width: b.width, height: h }; };
const box = (spec) => {
  if (!spec) return null;
  if (spec.rect) { const [x, y, width, height] = spec.rect; return { x, y, width, height }; }
  if (spec.union) {
    const bs = spec.union.map(box), x = Math.min(...bs.map((b) => b.x)), y = Math.min(...bs.map((b) => b.y));
    return { x, y, width: Math.max(...bs.map((b) => b.x + b.width)) - x, height: Math.max(...bs.map((b) => b.y + b.height)) - y };
  }
  const [scene, step, key, h] = spec, b = (F.scenes[scene].steps[step - 1].boxes || {})[key];
  if (!b) throw new Error(`${scene} step ${step} has no box ${key}`);
  return clip(h ? { ...b, height: Math.min(b.height, h) } : b);
};
const inSegment = (t) => Object.entries(F.seg).find(([, s]) => t >= s.start - 0.001 && t < s.start + s.dur)?.[0];

// a section title or a moral holds the frame alone: the frame dims, the words rise in, and only after they leave do the
// highlight and the caption of the next moment come
const held = (F.titles || []).map((s) => { const t = time(s.at); return { t, end: t + (s.dur || 1.8) + 0.3, s }; });
// a reveal lifts the frame from black after a slate or a page change; nothing moves or lights until it is up
const lifts = (F.reveals || []).map((r) => (r.from ? time(r.to) : time(r))).map((t) => ({ t, end: t + 0.7 }));
const quiet = (F.quiet || []).map((id) => ({ t: time([id]), end: time([id, "end"]) }));
const within = (ws, t) => ws.find((w) => t >= w.t - 0.05 && t < w.end);
const after = (t) => { for (let k = 0; k < 3; k++) { const w = within(held, t) || within(lifts, t); if (!w) break; t = w.end; } return t; };

// the camera: each cam moves the frame so its box fills a share of the screen, a cam with no box returns home; a cut may
// cap how far any zoom goes and how fast the camera moves (maxZoom and camDur in film.json)
const moves = (F.cams || []).map((c) => ({ ...c, t: after(time(c.at)), dur: c.dur ?? F.camDur ?? 0.9 }));
moves.forEach((c) => {
  const r = box(c.box);
  if (r) fx.camera(tl, stage, r, c.t, { fill: c.fill ?? 0.8, cx: c.cx, cy: c.cy, dur: c.dur, max: F.maxZoom });
  else fx.home(tl, stage, c.t, c.dur);
});

// the one highlight: each spot moves it, or a spot with no box takes it away. A spot that meets a camera move waits for
// it: the highlight leaves as the camera starts and appears in place once it stops, so it never runs ahead of the frame.
// In time order, since a hidden highlight appears in place and a shown one travels.
const spots = [];
(F.spots || []).forEach((s) => {
  let t = after(time(s.at));
  const m = moves.find((c) => c.dur > 0.1 && t >= c.t - 0.3 && t < c.t + c.dur);
  if (m) { spots.push({ t: Math.min(t, m.t), box: null, dur: 0.3 }); t = m.t + m.dur; }
  spots.push({ ...s, t });
});
// the highlight is gone before the title rises
held.forEach((h) => spots.push({ t: h.t - 0.4, box: null, dur: 0.3 }));
spots.sort((a, b) => a.t - b.t).forEach((s) => {
  const r = box(s.box);
  if (r) fx.spotlight(tl, stage, r, s.t, { color: s.amber ? "#f4b13e" : "#4fcbe2", dur: s.dur ?? 0.45 });
  else fx.unspot(tl, stage, s.t, s.dur ?? 0.5);
});

// the words: each caption lasts until the next one, its own end or the next title, and must be up long enough to read. A caption with
// parts builds its sentence: the whole sentence is laid out from the start, so nothing moves, and each part fades in at
// its own moment; every part must stay up long enough to read before the next.
const read = (html) => Math.max(1.4, html.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length * 0.22);
const cs = (F.caps || []).map((c) => ({ ...c, t: after(time(c.at)) })).sort((a, b) => a.t - b.t);
cs.forEach((c, i) => {
  let end = c.until ? time(c.until) : (i + 1 < cs.length ? cs[i + 1].t : F.duration - 0.2);
  const next = held.find((h) => h.t > c.t + 0.05);
  if (next) end = Math.min(end, next.t - 0.4);
  const parts = c.parts ? c.parts.map((p, k) => ({ t: k ? after(time(p.at)) : c.t, html: p.text })) : (c.text ? [{ t: c.t, html: c.text }] : []);
  if (!parts.length) return;
  parts.forEach((p, k) => {
    const until = k + 1 < parts.length ? parts[k + 1].t : end;
    if (until - p.t < read(p.html)) throw new Error(`caption ${i} part ${k} (${p.html.slice(0, 32)}) has ${(until - p.t).toFixed(2)} s`);
  });
  const el = fx.caption(tl, caps, "", c.t + 0.1, end, (c.amber ? "amber " : "") + (c.cls || ""));
  el.innerHTML = parts.map((p) => `<span class="part">${p.html}</span>`).join(" ");
  const spans = el.querySelectorAll(".part");
  parts.forEach((p, k) => { if (k) { gsap.set(spans[k], { opacity: 0 }); tl.to(spans[k], { opacity: 1, duration: 0.5 }, p.t); } });
  if (c.shade) tl.to("#shade", { opacity: 1, duration: 0.5 }, c.t);
});

// the titles themselves: the frame dims, the words rise in with an accent rule, and both leave; a moral stays to the end
held.forEach(({ t, s }) => {
  const d = s.dur || 1.8;
  const el = document.createElement("div");
  el.className = "title" + (s.cls ? " " + s.cls : "");
  el.innerHTML = `<i></i><span>${s.text}</span><b></b>`;
  titles.appendChild(el);
  tl.to(el, { opacity: 1, duration: 0.35 }, t);
  tl.from(el.querySelector("span"), { y: 36, opacity: 0, duration: 0.5, ease: "power3.out" }, t);
  tl.from(el.querySelector("b"), { scaleX: 0, duration: 0.5, ease: "power3.out" }, t + 0.1);
  if (t + d < F.duration - 0.1) tl.to(el, { opacity: 0, duration: 0.3 }, t + d);
  tl.to(caps, { opacity: 0, duration: 0.3 }, t - 0.4);
  if (t + d < F.duration - 0.1 && !within(quiet, t + d + 0.3)) tl.to(caps, { opacity: 1, duration: 0.2 }, t + d + 0.3);
});

// a reveal brings the frame up from the background colour, where a diagram that faded out hands over to the console
// a slate: the frame fades to black over the scene's last half second, the camera goes home under the black
(F.slates || []).forEach((id) => {
  const t = time([id]);
  tl.to("#dip", { opacity: 1, duration: 0.5 }, Math.max(0, t - 0.5));
  tl.set(stage, { scale: 1, x: 0, y: 0 }, t + 0.05);
});

// a page change goes through the background colour too: { from, to } darkens just before from and lifts after to, so
// the load between them never shows. Either way the new page comes up on the whole frame; a zoom on it is its own cam.
(F.reveals || []).forEach((r) => {
  if (r.from) {
    const a = time(r.from), b = time(r.to);
    tl.to("#dip", { opacity: 1, duration: 0.3 }, a - 0.3);
    tl.set(stage, { scale: 1, x: 0, y: 0 }, a);
    tl.to("#dip", { opacity: 0, duration: 0.6, ease: "power1.out" }, b);
    return;
  }
  const t = time(r);
  tl.set("#dip", { opacity: 1 }, t);
  tl.set(stage, { scale: 1, x: 0, y: 0 }, t);
  tl.to("#dip", { opacity: 0, duration: 0.7, ease: "power1.out" }, t);
});

// quiet segments carry their own words: the caption band steps aside
(F.quiet || []).forEach((id) => {
  tl.to(caps, { opacity: 0, duration: 0.2 }, time([id]));
  tl.to(caps, { opacity: 1, duration: 0.2 }, time([id, "end"]));
});

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
