<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600, height=900">
<title>The chat orchestrates development: one agent that reads the board and the roadmap and steers the running cards</title>
<link rel="stylesheet" href="../loop/diagram.css">
<link rel="stylesheet" href="../poster.css">
<style>
  .cols { display: flex; gap: 12px; margin-top: 6px; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--line-strong); background: var(--bg); }
  .col i { height: 26px; background: var(--bg-raised); border: 1px solid var(--line-strong); }
  .col.need i { border-color: var(--need); }
  .col.run { border-color: var(--accent); }
  .col.run i { border-color: var(--accent); }
  .col.run i::before { content: ""; display: block; width: 12px; height: 12px; margin: 6px 0 0 10px; border-radius: 50%; background: var(--accent); }
  .md { margin-top: 0; font: 30px/1.35 var(--font-mono); color: var(--text-muted); white-space: pre; }
  .md b { font-weight: 600; color: var(--text); }
  svg.wires { z-index: 2; }
  .lbl.hot { font-size: 44px; color: var(--accent); }
</style>
</head>
<body>
<svg class="wires" viewBox="0 0 1600 900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="wire-tip" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="tip-amb" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="q" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="tip-quiet" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <path class="wire amb" d="M352 380 H438" marker-start="url(#m)" marker-end="url(#m)"/>
  <path class="wire" d="M700 320 V50 H1344 V196" marker-end="url(#a)"/>
  <path class="wire quiet" d="M1000 345 H902" marker-end="url(#q)"/>
  <path class="wire quiet" d="M1000 430 H902" marker-end="url(#q)"/>
</svg>
<p class="lbl hot" style="left:722px; top:130px">steers</p>
<p class="lbl" style="left:906px; top:364px; font-size:32px">reads</p>

<div class="panel need" style="left:40px; top:300px; width:300px; height:160px">
  <h2>You</h2>
  <p class="say">one chat</p>
</div>

<div class="panel" style="left:450px; top:320px; width:440px; height:120px">
  <h2>Project agent</h2>
</div>

<div class="panel" style="left:1000px; top:100px; width:560px; height:280px">
  <h2>Board</h2>
  <div class="cols">
    <div class="col need"><i></i></div>
    <div class="col"><i></i><i></i><i></i></div>
    <div class="col run"><i></i><i></i><i></i></div>
    <div class="col"><i></i><i></i><i></i><i></i></div>
  </div>
</div>

<div class="panel" style="left:1000px; top:410px; width:560px; height:250px">
  <h2>Roadmap</h2>
  <p class="md"><b>## Level 4</b>
- [x] rock physics
- [ ] belt boss</p>
</div>
</body>
</html>
